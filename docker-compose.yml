services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: progress
      POSTGRES_PASSWORD: progress
      POSTGRES_DB: progress
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Also creates the progress_test database used by `pnpm test:api`.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U progress']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
