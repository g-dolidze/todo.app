name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: progress
          POSTGRES_PASSWORD: progress
          POSTGRES_DB: progress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progress -d progress_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://progress:progress@localhost:5432/progress_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Translations (ka / en have the same keys)
        run: pnpm i18n:check

      - name: Unit tests (shared + web)
        run: pnpm test:unit

      - name: API tests (real Postgres)
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Install Playwright browser (Chromium 141, same as local baselines)
        run: pnpm --filter @progress/web exec playwright install --with-deps chromium

      - name: E2E + visual regression (real API, axe, themes, languages, phone and desktop)
        run: pnpm test:e2e

      - name: Storybook build + every story renders and passes axe
        run: |
          pnpm --filter @progress/web build-storybook
          pnpm --filter @progress/web test:stories

      - name: Lighthouse CI (mobile, performance/accessibility/best practices/SEO ≥ 95, Web Vitals)
        run: pnpm --filter @progress/web lighthouse

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          retention-days: 7
